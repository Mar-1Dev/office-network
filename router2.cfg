!
version 15.1
!
hostname Router2
!
ip dhcp excluded-address 192.168.20.1 192.168.20.10
ip dhcp excluded-address 192.168.20.65 192.168.20.74
ip dhcp excluded-address 192.168.20.129 192.168.20.138
!
ip dhcp pool SALES
 network 192.168.20.0 255.255.255.192
 default-router 192.168.20.1
 dns-server 192.168.20.194
ip dhcp pool ENGINEERING
 network 192.168.20.64 255.255.255.192
 default-router 192.168.20.65
 dns-server 192.168.20.194
ip dhcp pool ADMIN
 network 192.168.20.128 255.255.255.192
 default-router 192.168.20.129
 dns-server 192.168.20.194
!
ip cef
no ipv6 cef
!
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 192.168.20.1 255.255.255.192
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/1.20
 encapsulation dot1Q 20
 ip address 192.168.20.65 255.255.255.192
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/2.30
 encapsulation dot1Q 30
 ip address 192.168.20.129 255.255.255.192
!
interface GigabitEthernet0/2.99
 encapsulation dot1Q 99
 ip address 192.168.20.193 255.255.255.192
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
end
